name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m
          working-directory: api

  lint-frontend:
    name: Lint (TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - run: mise -C ui run install

      - run: mise -C ui run lint

  vuln:
    name: Vuln (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - run: mise -C api run vuln

  vuln-frontend:
    name: Vuln (TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      # bun audit reads bun.lock directly — no install needed.
      - run: mise -C ui run vuln

  test:
    name: Test (Go)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8.10.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Run tests
        run: mise -C api run test
        env:
          REDIS_URL: redis://localhost:6379

  typecheck-frontend:
    name: Typecheck (TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - run: mise -C ui run install

      - run: mise -C ui run typecheck

  build:
    name: Build images
    runs-on: ubuntu-latest
    needs: [lint, lint-frontend, vuln, vuln-frontend, test, typecheck-frontend]

    steps:
      - uses: actions/checkout@v7

      - name: Build API image
        run: podman build -f Containerfile -t diktyon-api:${{ github.sha }} .
        working-directory: api

      - name: Build UI image
        run: podman build -f Containerfile -t diktyon-ui:${{ github.sha }} .
        working-directory: ui
